name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly: a fresh fuzz seed
  workflow_dispatch:
    inputs:
      fuzz_seed:
        description: Seed for the differential fuzz job (empty = run id)
        required: false
      fuzz_count:
        description: Number of random rules
        required: false
        default: '50000'

jobs:
  # The TypeScript package on the shared corpus (fixtures/*.json), plus
  # rrule.js's own unit tests.
  ts:
    runs-on: ubuntu-latest
    # Fails fast if a regression makes a rule loop forever.
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The Dart package on the same corpus.
  dart:
    runs-on: ubuntu-latest
    # Fails fast if a regression makes a rule loop forever.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bench
      - run: dart analyze --fatal-infos
      - run: dart test

  # The committed corpus must be exactly what the TypeScript package produces
  # (and every hand-verified expectation must hold).
  fixtures-up-to-date:
    runs-on: ubuntu-latest
    # Fails fast if a regression makes a rule loop forever.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/ts
      - run: node tools/gen-fixtures.mjs
      - run: git diff --exit-code fixtures/

  # Differential fuzzing: fresh random rules (not in the corpus), expected
  # values from TypeScript, checked by the Dart package.
  fuzz:
    runs-on: ubuntu-latest
    needs: [ts, dart]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: npm ci && npm run build
        working-directory: packages/ts
      - name: Generate fresh rules
        run: node tools/fuzz.mjs "$RUNNER_TEMP/fuzz.json" "${{ inputs.fuzz_seed || github.run_id }}" "${{ inputs.fuzz_count || '50000' }}"
      - name: The independent oracle must agree with TypeScript
        run: node tools/verify.mjs "$RUNNER_TEMP/fuzz.json"
      - name: Dart must agree with TypeScript
        working-directory: packages/dart
        run: dart pub get && FIXTURES="$RUNNER_TEMP/fuzz.json" dart test test/conformance_test.dart
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-cases
          path: ${{ runner.temp }}/fuzz.json

  # Independent verification of the committed corpus, on every change:
  # the brute-force RFC oracle (tools/verify/oracle.mjs) for DAILY..YEARLY
  # rules, python-dateutil for the rest. Regenerating fixtures from the
  # TypeScript package alone could bless a shared defect.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Hand-checked tests of the oracle itself.
      - run: node --test tools/verify/oracle.test.mjs
      - run: pip install python-dateutil==4.0.0
      # Slow: dateutil spins on never-matching rules until a 3 s timeout.
      - run: python -I tools/verify/dateutil_eval.py "$RUNNER_TEMP/du.json" fixtures/*.json
      - run: node tools/verify.mjs --dateutil "$RUNNER_TEMP/du.json" fixtures/*.json
